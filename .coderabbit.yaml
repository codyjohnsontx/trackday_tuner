# CodeRabbit configuration
#
# Goal: one review per pull request, on final code. CodeRabbit's defaults
# re-review after every push, so a branch that takes three fix commits after
# the first review spends three more reviews on code nobody asked it to look
# at again. That is the whole reason this file exists.

reviews:
  # Already the default. Stated explicitly so nobody raises it to assertive
  # later and wonders where the noise came from.
  profile: chill

  auto_review:
    enabled: true

    # THE ONE THAT MATTERS.
    # Default is true: CodeRabbit re-reviews as new commits land. With this
    # off it reviews once, and re-reviews only when asked with
    # `@coderabbitai review` - same review, requested when the branch is
    # actually ready.
    auto_incremental_review: false

    # Already the default. Draft pull requests are not reviewed, which is what
    # makes "open as a draft, publish when ready" cost nothing.
    drafts: false

  # Skip what nobody should be reviewing. Every entry here is generated,
  # binary, or build output.
  #
  # Absence from this list is not exclusion-by-omission: CodeRabbit ships its
  # own built-in skip list (137 patterns, published under "Default ignored
  # paths" at https://docs.coderabbit.ai/configuration/path-instructions), and
  # anything on it stays skipped whatever is written here. `package-lock.json`
  # and `**/*.svg` are on it, so they are unreviewed today. Do not try to buy
  # them back with an include - see below.
  path_filters:
    # DO NOT ADD AN ENTRY WITHOUT A LEADING `!`. Read this before you try.
    #
    # An entry without `!` is an INCLUDE, and a single include NARROWS the
    # whole review to only what it matches. Everything else is then skipped
    # with "excluded by none and included by none" - skipped not because
    # something excludes it but because nothing includes it. This is not a
    # guess: four includes in the sibling DiazOnDemand repository switched
    # review off for nearly everything it had for most of a day, including for
    # a path that was itself force-included. The documented "an include naming
    # a blocked path removes the pattern from both lists" escape hatch was
    # tested there directly and did not hold.
    #
    # If you think you need a force-include, you need a different mechanism
    # (a dependency-review action, human eyes on the file), not an entry here.
    #
    # Everything not listed below - TypeScript, TSX, markdown, SQL migrations,
    # CSS, config - is reviewed by default and is deliberately left that way.
    # `supabase/migrations/**` in particular is the highest-risk change in this
    # repository (see CLAUDE.md: an applied migration can never be edited) and
    # is NOT on the built-in skip list, so it stays reviewed.

    # Generated by `npm run rag:index` from docs/knowledge-base/. Committed on
    # purpose - Vercel deploys from git and the AI routes read it from disk -
    # but it is machine-written and a diff of it is thousands of lines of
    # embeddings. The markdown it is built from is reviewed.
    - '!data/rag-index.json'

    # TypeScript incremental build state. Gitignored; cheap insurance against
    # a stray `git add -f`.
    - '!**/*.tsbuildinfo'

    # Build and test output. All gitignored today, so these are insurance
    # rather than a live problem.
    - '!**/.next/**'
    - '!out/**'
    - '!**/coverage/**'
    - '!test-results/**'
    - '!playwright-report/**'

    # Binary assets. There is nothing to read in the diff of a raster image or
    # an Office document. `public/images/login-hero.jpg` and the PM case-study
    # deck under docs/ are the tracked examples.
    - '!**/*.png'
    - '!**/*.jpg'
    - '!**/*.jpeg'
    - '!**/*.gif'
    - '!**/*.webp'
    - '!**/*.ico'
    - '!**/*.woff'
    - '!**/*.woff2'
    - '!**/*.pptx'
    - '!**/*.pdf'

  # Keep. This is the summary that actually gets read.
  high_level_summary: true

  # Keep. The status line is how a finished review is told from a running one.
  review_status: true

  poem: false
