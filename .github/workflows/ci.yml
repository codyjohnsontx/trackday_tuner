name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Run Playwright e2e tests (needs real Supabase/OpenAI secrets)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Dummy values so `next build` can prerender without real credentials.
# Never put real secrets here — the e2e job pulls real values from repo secrets.
env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
  STRIPE_SECRET_KEY: sk_test_ci_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
  STRIPE_PRO_MONTHLY_PRICE_ID: price_ci_placeholder
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
  OPENAI_API_KEY: sk-ci-placeholder
  AI_REQUEST_FINGERPRINT_SECRET: ci-placeholder-fingerprint-secret
  BETA_INVITE_SECRET: ci-placeholder-beta-secret

jobs:
  checks:
    name: Lint, unit tests, build, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      # tsc must run after the build so .next/types exist
      - name: Typecheck
        run: npx tsc --noEmit

  # Manual-only: needs a live app plus real Supabase/OpenAI credentials.
  # Deliberately NOT part of the PR-required checks.
  e2e:
    name: Playwright e2e (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRO_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_PRO_MONTHLY_PRICE_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_REQUEST_FINGERPRINT_SECRET: ${{ secrets.AI_REQUEST_FINGERPRINT_SECRET }}
      BETA_INVITE_SECRET: ${{ secrets.BETA_INVITE_SECRET }}
      RUN_E2E: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
