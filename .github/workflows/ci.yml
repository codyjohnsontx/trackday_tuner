name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all_devices:
        description: Run the e2e suite on all six device projects, not only the two merge-blocking ones
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN: this workflow only needs to read the repo.
permissions:
  contents: read

# Dummy values so `next build` can prerender without real credentials.
# Never put real secrets here. The db and e2e jobs replace the Supabase ones
# with the fixed local credentials of a stack started inside the runner.
env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
  STRIPE_SECRET_KEY: sk_test_ci_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
  STRIPE_PRO_MONTHLY_PRICE_ID: price_ci_placeholder
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
  OPENAI_API_KEY: sk-ci-placeholder
  AI_REQUEST_FINGERPRINT_SECRET: ci-placeholder-fingerprint-secret
  BETA_INVITE_SECRET: ci-placeholder-beta-secret

jobs:
  checks:
    name: Lint, unit tests, build, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      # Offline mode replays the committed recordings in
      # tests/fixtures/rag-eval/recordings/, so it runs the whole RAG pipeline -
      # embed, retrieve, prompt, model, policy - without opening a socket and
      # without a real key. The placeholder OPENAI_API_KEY above is never sent
      # anywhere; it exists because the OpenAI client is constructed for real.
      #
      # It fails on a gated metric or its coverage regressing against
      # eval-baseline.json, and on anything that leaves the run unable to have
      # measured that: a recording that no longer matches the request (which is
      # what a prompt or retrieval change looks like from here - see the PR
      # template), a baseline that cannot gate, a relabelled or swapped-out
      # golden case, or a run `describeUnsoundRun` (scripts/eval/run.mjs)
      # rejects. That function and AGENTS.md ("The RAG Eval Harness") are the
      # definitions; this comment deliberately keeps no second copy of the list,
      # because the copy it used to keep went stale within one branch.
      - name: RAG eval (offline replay)
        run: npm run rag:eval

      - name: Build
        run: npm run build

      # tsc must run after the build so .next/types exist
      - name: Typecheck
        run: npx tsc --noEmit

  # The real-database suite (tests/db/, TESTING.md "Real-database tests") on
  # every pull request, against a local Supabase stack built from
  # supabase/migrations/ inside the runner. The stack is thrown away with it, so
  # this job needs no secret; the credentials `supabase status` prints are the
  # CLI's fixed local ones and replace the placeholders above for the test step.
  db:
    name: Real-database tests (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only the database, auth, the REST API and its gateway are needed, plus
      # storage so the buckets in supabase/config.toml are provisioned as on any
      # other stack.
      - name: Start local Supabase
        run: npx supabase start -x imgproxy,supavisor,postgres-meta,vector,logflare,studio,edge-runtime,realtime

      - name: Real-database tests
        run: |
          eval "$(npx supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY)"
          export NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY
          npm run test:db

  # The Playwright suite (tests/e2e/, TESTING.md) in a real browser on every pull
  # request, against a local Supabase stack built from supabase/migrations/ the
  # way the db job builds one, and a production build of the app pointed at it.
  # No hosted project and no secret is involved: the stack is thrown away with
  # the runner, and scripts/seed-e2e-accounts.mjs makes the shared Pro account
  # and the free-tier fixture the specs sign in as.
  #
  # No spec needs a model. The AI specs assert the refusals that happen before
  # one is called, and OPENAI_BASE_URL points the client at a closed local port
  # so a spec that did reach one would fail here instead of leaving the runner.
  #
  # Pull requests run the two merge-blocking device projects (TESTING.md
  # "Support Matrix"); a manual dispatch with all_devices runs all six.
  e2e:
    name: Playwright e2e (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      OPENAI_BASE_URL: http://127.0.0.1:9/v1
      # The signup specs need the form to sign up through GoTrue rather than
      # /api/beta/signup (TESTING.md).
      BETA_INVITE_ONLY: 'false'
      RUN_E2E: '1'
      ALL_DEVICES: ${{ inputs.all_devices == true }}
      # See "Pull the Playwright image" below before changing this.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same services as the db job.
      - name: Start local Supabase
        run: npx supabase start -x imgproxy,supavisor,postgres-meta,vector,logflare,studio,edge-runtime,realtime

      # Replaces the placeholders above for every later step. The build needs
      # them too, because the browser bundle has NEXT_PUBLIC_SUPABASE_URL baked
      # in and next.config.ts derives the next/image host from it.
      - name: Point the app at the local stack
        run: |
          eval "$(npx supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Seed the e2e accounts
        run: node scripts/seed-e2e-accounts.mjs >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      # The suite runs inside Playwright's official image, which ships the
      # browsers and every system library they need. `playwright install
      # --with-deps` used to fetch about 190 WebKit packages from Ubuntu's apt
      # mirror on every run, and on a slow mirror that step alone took 30-40
      # minutes and once ran the job past its time limit. Only the test run is in
      # the container: Supabase, the build and the seed stay on the runner, and
      # --network host keeps 127.0.0.1 meaning the runner, so the stack and the
      # NEXT_PUBLIC_SUPABASE_URL baked into the build are reached exactly as
      # before. The runner's own Node (setup-node above) is mounted and put
      # first on PATH so `next start` runs on the Node the app was built with.
      #
      # The tag must equal the locked @playwright/test version
      # (package-lock.json), or the runner looks for browser builds the image
      # does not have. When Playwright is upgraded, change PLAYWRIGHT_IMAGE (job
      # env above) to mcr.microsoft.com/playwright:v<new version>-noble in the
      # same change; this step fails until the two agree.
      #
      # The image has no Microsoft Edge, so an all_devices dispatch installs it
      # inside the container for desktop-edge; pull requests never do.
      - name: Pull the Playwright image
        run: |
          locked="$(node -p "require('./node_modules/@playwright/test/package.json').version")"
          case "$PLAYWRIGHT_IMAGE" in
            *":v$locked-"*) ;;
            *) echo "::error::$PLAYWRIGHT_IMAGE does not match the locked @playwright/test $locked"; exit 1 ;;
          esac
          docker pull --quiet "$PLAYWRIGHT_IMAGE"

      # playwright.config.ts serves the build with `next start` under CI.
      - name: Run e2e tests
        run: |
          # Forward the job's environment (the placeholders, the local stack's
          # keys and the seeded accounts written to GITHUB_ENV, CI) by name.
          env_args=()
          for name in $(compgen -e); do
            case "$name" in
              PATH|HOME|HOSTNAME|PWD|OLDPWD|SHLVL|USER|LOGNAME|SHELL|TMPDIR|_) ;;
              *) env_args+=(-e "$name") ;;
            esac
          done

          if [ "$ALL_DEVICES" = "true" ]; then
            suite='npx playwright install msedge && npm run test:e2e'
          else
            suite='npm run test:e2e -- --project=iphone-safari --project=android-chrome'
          fi

          node_dir="$(dirname "$(dirname "$(command -v node)")")"
          docker run --rm --network host --ipc host --init \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -v "$node_dir:$node_dir:ro" \
            "${env_args[@]}" \
            -e HOME=/root \
            -e PATH="$node_dir/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            "$PLAYWRIGHT_IMAGE" bash -c "$suite"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
