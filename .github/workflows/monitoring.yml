# The scheduled probe. Every 15 minutes it asks the deployment two questions and
# fails the run if either answer is not a 200:
#
#   /api/health                 - can this deployment serve? (Postgres reachable,
#                                 RAG index present in the bundle)
#   /api/monitoring/ai-health   - has anything failed in the last hour? (error
#                                 rate and p95 latency over `ai_requests`)
#
# A failed scheduled run is itself the alert, and this file configures no
# recipient for it: GitHub notifies the user who CREATED this workflow, or
# whoever last edited the `cron:` line below, and only if that user has Actions
# email notifications enabled. So the alert follows commit authorship rather
# than anything set here, and editing that cron line moves it to you. That is
# the cheapest channel and the only one needing no external account, but it is
# worth proving once rather than assuming - docs/monitoring.md step 2 item 5
# walks through failing this on purpose and checking the mail arrives. A webhook
# (`MONITORING_ALERT_WEBHOOK_URL` on the deployment) is the upgrade, and an
# external uptime monitor pointed at /api/health is the belt-and-braces third
# path. See docs/monitoring.md.
#
# GitHub disables a scheduled workflow in a public repository after 60 days with
# no commit activity, and re-enabling it is a button in the Actions tab. That is
# the one way this can go quiet without saying so, which is why it is not the
# only channel.
name: Monitoring

on:
  schedule:
    # Every 15 minutes. GitHub runs scheduled workflows on a best-effort basis
    # and can delay one under load, which is fine here: the alert window is an
    # hour, so a late run still sees the same failures.
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: monitoring
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    name: Probe production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Until the URL and secret are set this exits clean with a warning rather
      # than failing every 15 minutes, because an alert channel that cries wolf
      # from the day it merges is one nobody reads by the time it matters.
      - name: Check the probe is configured
        id: config
        env:
          APP_URL: ${{ vars.MONITORING_APP_URL }}
          CRON_SECRET: ${{ secrets.MONITORING_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::Monitoring is not wired up yet. Set the MONITORING_APP_URL repository variable and the MONITORING_CRON_SECRET repository secret - see docs/monitoring.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Uptime - /api/health
        if: steps.config.outputs.configured == 'true'
        env:
          APP_URL: ${{ vars.MONITORING_APP_URL }}
        run: |
          set -uo pipefail
          body=$(mktemp)
          code=$(curl --silent --show-error --location --max-time 30 \
            --output "$body" --write-out '%{http_code}' \
            "${APP_URL%/}/api/health") || code=000
          echo "HTTP $code"
          cat "$body"; echo
          if [ "$code" != "200" ]; then
            echo "::error::/api/health answered $code. The deployment cannot serve - the body above names the failing check."
            exit 1
          fi

      # The two probes answer independent questions, so a failing /api/health must
      # not skip this one: in the R3 shape the uptime check is exactly what fails,
      # and skipping here would withhold the webhook and the AI summary with it.
      - name: Alert - AI error rate and p95 latency over the last hour
        if: ${{ !cancelled() && steps.config.outputs.configured == 'true' }}
        env:
          APP_URL: ${{ vars.MONITORING_APP_URL }}
          CRON_SECRET: ${{ secrets.MONITORING_CRON_SECRET }}
        run: |
          set -uo pipefail
          # The body is discarded rather than printed: this repository is public,
          # so its Actions logs are too, and this endpoint is bearer-gated
          # precisely because its numbers are not. A status and a pass/fail is
          # all a stranger may read. The full summary still reaches the operator
          # through the webhook payload.
          #
          # No --location here, unlike the uptime step above, and it must not be
          # added back. curl drops the Authorization header on a redirect to a
          # different host (the CVE-2018-1000007 fix), so a MONITORING_APP_URL
          # that redirects - a Vercel apex going to www, or a non-primary alias -
          # would follow it as an UNAUTHENTICATED request and read as a 401,
          # sending the operator off to re-check two secrets that already agree.
          # Without it the same misconfiguration surfaces as `HTTP 308`, which
          # names itself. --location-trusted is not the answer: it would hand the
          # secret to whatever host the redirect names.
          code=$(curl --silent --show-error --max-time 30 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --output /dev/null --write-out '%{http_code}' \
            "${APP_URL%/}/api/monitoring/ai-health") || code=000
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::/api/monitoring/ai-health answered $code. The body is deliberately not printed here - run the curl under \"Verify it worked\" in step 2 of docs/monitoring.md to see which requests failed and why."
            exit 1
          fi
